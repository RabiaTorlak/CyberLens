<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#64748b">CyberLens — Detection Engineering &amp; SOC Pipeline</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#64748b">Simulate → Ingest → Detect → Alert → Enrich → Respond → Investigate</text>

  <!-- 1. Attack lab -->
  <rect x="24" y="110" width="170" height="112" rx="10" fill="#be123c"/>
  <text x="109" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Saldırı Lab</text>
  <text x="109" y="160" text-anchor="middle" font-size="11" fill="#fecdd3">poc_lab_simulator.py</text>
  <text x="109" y="184" text-anchor="middle" font-size="11" fill="#fecdd3">20 senaryo şablonu</text>
  <text x="109" y="202" text-anchor="middle" font-size="11" fill="#fecdd3">rastgele IP üretici</text>

  <!-- 2. Ingestion -->
  <rect x="234" y="110" width="170" height="112" rx="10" fill="#7c3aed"/>
  <text x="319" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Ingestion</text>
  <text x="319" y="160" text-anchor="middle" font-size="11" fill="#ede9fe">log_processor.py</text>
  <text x="319" y="184" text-anchor="middle" font-size="11" fill="#ede9fe">normalize + temizle</text>
  <text x="319" y="202" text-anchor="middle" font-size="11" fill="#ede9fe">batch (5 sn / 10 kayıt)</text>

  <!-- 3. Supabase -->
  <rect x="444" y="96" width="210" height="140" rx="12" fill="#047857"/>
  <text x="549" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Supabase (PostgreSQL)</text>
  <text x="549" y="152" text-anchor="middle" font-size="12" fill="#d1fae5">logs · rules · alerts</text>
  <text x="549" y="172" text-anchor="middle" font-size="12" fill="#d1fae5">platform_settings</text>
  <text x="549" y="200" text-anchor="middle" font-size="11" fill="#a7f3d0">Realtime yayını (alerts)</text>
  <text x="549" y="218" text-anchor="middle" font-size="11" fill="#a7f3d0">5 SQL migration</text>

  <!-- 4. Detection -->
  <rect x="694" y="96" width="242" height="140" rx="12" fill="#2563eb"/>
  <text x="815" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Tespit Motoru</text>
  <text x="815" y="146" text-anchor="middle" font-size="11" fill="#dbeafe">ai_engine.py</text>
  <text x="815" y="170" text-anchor="middle" font-size="11" fill="#dbeafe">Cursor LLM  |  sezgisel yedek</text>
  <text x="815" y="190" text-anchor="middle" font-size="11" fill="#dbeafe">KQL tespit kuralı üretimi</text>
  <text x="815" y="210" text-anchor="middle" font-size="11" fill="#dbeafe">NIST CSF · OWASP · MITRE ATT&amp;CK</text>

  <!-- arrows row 1 -->
  <line x1="194" y1="166" x2="230" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="404" y1="166" x2="440" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="654" y1="150" x2="690" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="190" x2="658" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="672" y="142" text-anchor="middle" font-size="10" fill="#64748b">log</text>
  <text x="672" y="206" text-anchor="middle" font-size="10" fill="#64748b">kural</text>

  <!-- row 2 -->
  <rect x="694" y="290" width="242" height="96" rx="10" fill="#ea580c"/>
  <text x="815" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Alarm + SOAR</text>
  <text x="815" y="340" text-anchor="middle" font-size="11" fill="#ffedd5">alert_engine.py · response_engine.py</text>
  <text x="815" y="360" text-anchor="middle" font-size="11" fill="#ffedd5">playbook: IP engelle · host izole</text>
  <text x="815" y="376" text-anchor="middle" font-size="10" fill="#fed7aa">(simülasyon, global anahtarla)</text>
  <line x1="815" y1="236" x2="815" y2="286" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M694,338 L600,338 L600,240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="648" y="330" text-anchor="middle" font-size="10" fill="#64748b">alarm</text>

  <rect x="444" y="290" width="140" height="96" rx="10" fill="#0d9488"/>
  <text x="514" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Threat Intel</text>
  <text x="514" y="338" text-anchor="middle" font-size="11" fill="#ccfbf1">threat_intel.py</text>
  <text x="514" y="356" text-anchor="middle" font-size="10" fill="#99f6e4">VirusTotal · AbuseIPDB</text>
  <text x="514" y="372" text-anchor="middle" font-size="10" fill="#99f6e4">AlienVault OTX</text>

  <rect x="234" y="290" width="170" height="96" rx="10" fill="#475569"/>
  <text x="319" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Adli Zaman Çizelgesi</text>
  <text x="319" y="338" text-anchor="middle" font-size="11" fill="#e2e8f0">forensic_engine.py</text>
  <text x="319" y="358" text-anchor="middle" font-size="10" fill="#cbd5e1">aynı host/kullanıcının</text>
  <text x="319" y="374" text-anchor="middle" font-size="10" fill="#cbd5e1">olayları kronolojik</text>

  <rect x="24" y="290" width="170" height="96" rx="10" fill="#475569"/>
  <text x="109" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Günlük Rapor</text>
  <text x="109" y="338" text-anchor="middle" font-size="11" fill="#e2e8f0">reporter.py</text>
  <text x="109" y="358" text-anchor="middle" font-size="10" fill="#cbd5e1">kritik alarmlar</text>
  <text x="109" y="374" text-anchor="middle" font-size="10" fill="#cbd5e1">Markdown + JSON</text>

  <line x1="514" y1="240" x2="514" y2="286" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="240" x2="360" y2="286" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M460,236 L460,256 L109,256 L109,286" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- UI -->
  <rect x="24" y="440" width="912" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="480" y="470" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Streamlit SOC Paneli (app.py · src/ui/)</text>
  <text x="250" y="502" text-anchor="middle" font-size="12" fill="#cbd5e1">🛡️ Güvenlik Paneli</text>
  <text x="250" y="522" text-anchor="middle" font-size="11" fill="#94a3b8">canlı alarm akışı · TI özeti · zaman çizelgesi</text>
  <text x="250" y="540" text-anchor="middle" font-size="11" fill="#94a3b8">kural üretici · SOAR anahtarı</text>
  <text x="710" y="502" text-anchor="middle" font-size="12" fill="#cbd5e1">🧪 Saldırı Lab</text>
  <text x="710" y="522" text-anchor="middle" font-size="11" fill="#94a3b8">senaryo üret · logları gönder</text>
  <text x="710" y="540" text-anchor="middle" font-size="11" fill="#94a3b8">otomatik analiz</text>
  <line x1="480" y1="390" x2="480" y2="436" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="492" y="418" font-size="10" fill="#64748b">Supabase Realtime</text>
</svg>
