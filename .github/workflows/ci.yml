name: CI

# Her push ve pull request'te lint + birim testleri çalıştırır.
# Testler Supabase veya dış API anahtarı gerektirmez.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bağımlılıkları yükle
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: SQL migration dosyaları mevcut mu
        run: test "$(ls supabase/migrations/*.sql | wc -l)" -ge 5

      - name: Birim testleri (pytest)
        run: pytest -q
